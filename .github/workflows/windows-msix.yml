name: Windows MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-msix.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Test Windows quota mapping
        run: dotnet test Windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj --configuration Release -p:AppxPackage=false
      - name: Build MSIX
        run: >
          msbuild Windows/CodexMeter.Windows/CodexMeter.Windows.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: CodexMeter-Windows-MSIX
          path: artifacts/**/*.msix
          if-no-files-found: error
      - name: Attach MSIX to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not (gh release view $tag 2>$null)) { gh release create $tag --title "Codex Meter $tag" --generate-notes }
          Get-ChildItem "$env:GITHUB_WORKSPACE/artifacts" -Recurse -Filter *.msix | ForEach-Object { gh release upload $tag $_.FullName --clobber }
