name: Windows MSIX

on:
  workflow_dispatch:
  push:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-msix.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Test Windows quota mapping
        run: dotnet test Windows/CodexMeter.Windows.Tests/CodexMeter.Windows.Tests.csproj --configuration Release -p:AppxPackage=false
      - name: Build MSIX
        run: >
          msbuild Windows/CodexMeter.Windows/CodexMeter.Windows.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: CodexMeter-Windows-MSIX
          path: artifacts/**/*.msix
          if-no-files-found: error
